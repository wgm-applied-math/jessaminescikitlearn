[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jessaminescikitlearn"
dynamic = ["version"]
description = "Python scikit-learn wrapper for Jessamine"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
keywords = []
authors = [
  { name = "W. Garrett Mitchener", email = "garrett.mitchener@gmail.com" },
  { name = "Aidan Riordan" },
  { name = "Latherial Calbert" },
  { name = "Aiden Camilleri" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

# Package versions as of 2026-06-15
# Assuming all packages are semantic-versioning compliant
dependencies = [
    # Fedora 43 is at 2.3, pypi is at 2.4
    "numpy~=2.3",
    # Fedora 43 is at 1.7.2, pypi is at 1.9.0
    "scikit-learn~=1.7",
    # Fedora 43 and pypi are at 1.14.0
    "sympy~=1.14",
    # pypi is at 0.9.35
    "juliacall~=0.9",
    # Fedora 43 is at 2.3.3, pypi is at 3.0.3
    "pandas~=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# [project.scripts]
# jessamineskl = "jessaminescikitlearn.__main__:main"

[project.urls]
Documentation = "https://github.com/wgm-applied-math/jessaminescikitlearn#readme"
Issues = "https://github.com/wgm-applied-math/jessaminescikitlearn/issues"
Source = "https://github.com/wgm-applied-math/jessaminescikitlearn"


[tool.hatch.version]
path = "src/jessaminescikitlearn/__about__.py"


[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jessaminescikitlearn"]

# This seems to fix the problem with stale Manifest.toml files in the test environment.
# By the way:
# `hatch test` seems to use the `hatch-test` environment,
# and it looks for a `run` field to determine what to do.
# The juliapkg.resolve() doesn't do what needs to be done without `force=True`.
[tool.hatch.envs.hatch-test.scripts]
run = [
    "python -c 'import juliapkg; juliapkg.resolve(force=True)'",
    "pytest {args:tests}",
]

